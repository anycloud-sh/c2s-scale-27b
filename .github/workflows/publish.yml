name: Publish container

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - name: Check out artifact source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            IMAGE_REVISION=${{ github.sha }}
          tags: ghcr.io/anycloud-sh/c2s-scale-27b:0.2.0-44c2ff7-r2-${{ matrix.suffix }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-architecture manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/anycloud-sh/c2s-scale-27b:0.2.0-44c2ff7-r2 \
            ghcr.io/anycloud-sh/c2s-scale-27b:0.2.0-44c2ff7-r2-amd64 \
            ghcr.io/anycloud-sh/c2s-scale-27b:0.2.0-44c2ff7-r2-arm64

      - name: Inspect published manifest
        run: docker buildx imagetools inspect ghcr.io/anycloud-sh/c2s-scale-27b:0.2.0-44c2ff7-r2
