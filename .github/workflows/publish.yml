name: Build candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out artifact source
        uses: actions/checkout@v4

      - name: Set architecture candidate name
        id: names
        run: echo "candidate=ghcr.io/anycloud-sh/c2s-scale-27b:candidate-${GITHUB_SHA}-${{ matrix.suffix }}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            IMAGE_REVISION=${{ github.sha }}
          tags: ${{ steps.names.outputs.candidate }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set candidate name
        id: names
        run: echo "candidate=ghcr.io/anycloud-sh/c2s-scale-27b:candidate-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-architecture candidate manifest
        env:
          CANDIDATE: ${{ steps.names.outputs.candidate }}
        run: |
          docker buildx imagetools create \
            --tag "${CANDIDATE}" \
            "${CANDIDATE}-amd64" \
            "${CANDIDATE}-arm64"

      - name: Record validation input
        env:
          CANDIDATE: ${{ steps.names.outputs.candidate }}
        run: |
          DIGEST="$(docker buildx imagetools inspect "${CANDIDATE}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          docker buildx imagetools inspect "${CANDIDATE}"
          {
            echo "## Candidate published"
            echo
            echo "- Image: \`${CANDIDATE}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Validation input: \`ghcr.io/anycloud-sh/c2s-scale-27b@${DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
