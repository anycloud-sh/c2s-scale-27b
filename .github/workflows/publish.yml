name: Build candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      candidate: ${{ steps.names.outputs.candidate }}
    steps:
      - name: Check out artifact source
        uses: actions/checkout@v4

      - name: Set candidate name
        id: names
        run: echo "candidate=ghcr.io/anycloud-sh/c2s-scale-27b:candidate-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            IMAGE_REVISION=${{ github.sha }}
          tags: ${{ steps.names.outputs.candidate }}

      - name: Record validation input
        env:
          CANDIDATE: ${{ steps.names.outputs.candidate }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Candidate published"
            echo
            echo "- Image: \`${CANDIDATE}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Validation input: \`ghcr.io/anycloud-sh/c2s-scale-27b@${DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
